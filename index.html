<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>f0rsenic9 Framework</title>
    <style>
        /* Modern Minimalist Terminal Theme */
        body {
            background-color: #06090f;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 30px 20px;
            background: #0d111a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: -1px;
            color: #a855f7; /* High-tech purple branding */
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .subtitle {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 40px;
        }

        /* Pure CSS Minimal Interaction Button */
        .btn-run {
            background-color: #ffffff;
            color: #06090f;
            border: none;
            padding: 16px 44px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 75%;
            transition: all 0.15s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-run:active {
            transform: scale(0.96);
            background-color: #cbd5e1;
        }

        .console-output {
            margin-top: 40px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            min-height: 70px;
            text-align: left;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .log-success { color: #4ade80; }
        .log-info { color: #38bdf8; }
    </style>

    <!-- Include your upcoming utility files sequentially -->
    <script src="utils.js"></script>
    <script src="exploit.js"></script>
    
    <script>
        function printLog(message, type) {
            var consoleDiv = document.getElementById("log-box");
            var entry = document.createElement("div");
            entry.className = "log-entry";
            
            if (type === "success") entry.className += " log-success";
            if (type === "info") entry.className += " log-info";
            
            entry.innerHTML = "[*] " + message;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function triggerFramework() {
            var btn = document.getElementById("run-btn");
            btn.disabled = true;
            btn.style.opacity = "0.3";
            btn.innerHTML = "running...";

            printLog("f0rsenic9 environment active.", "info");
            
            // Delays pass sequential control to your auxiliary files
            setTimeout(function() {
                if (typeof parseMemoryStats === "function") {
                    parseMemoryStats();
                }
            }, 800);

            setTimeout(function() {
                if (typeof initMemoryAnalysis === "function") {
                    initMemoryAnalysis();
                }
            }, 2000);
        }
    </script>
</head>
<body>

    <div class="container">
        <h1>f0rsenic9</h1>
        <div class="subtitle">WebKit Interface // iOS 9.3.6</div>
        
        <button id="run-btn" class="btn-run" onclick="triggerFramework()">run</button>
        
        <div id="log-box" class="console-output">
            <div class="log-entry">System ready for deployment testing.</div>
        </div>
    </div>

</body>
</html>
